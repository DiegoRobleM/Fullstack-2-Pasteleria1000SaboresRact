spring.application.name=BackPasteleria
server.port=8080

# Base de datos MySQL en AWS RDS (los valores vienen de variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Token JWT: en producción define JWT_SECRET (mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-cambiar-en-produccion-2026}
app.jwt.horas=2

# Contraseña del administrador de demostración (admin@pasteleria.test)
app.admin.password=${ADMIN_PASSWORD:AdminDemo123!}
