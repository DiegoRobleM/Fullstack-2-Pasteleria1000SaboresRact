spring.application.name=BackPasteleria
server.port=8080

# Base de datos H2 en memoria (arranca sin instalar nada; los datos se pierden al detener la app)
spring.datasource.url=jdbc:h2:mem:pasteleria;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
